name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build signed release APK"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  release:
    name: Build signed release APK
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release metadata
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          if ! grep -q "^## Rilis ${VERSION}$" README.md; then
            echo "README.md belum punya bagian ## Rilis ${VERSION}."
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "versionName ($VERSION) tidak cocok dengan tag ($TAG_VERSION)."
              exit 1
            fi
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          test -s app/release.keystore

      - name: Assemble signed release
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKTOOL=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKTOOL" ]; then
            "$APKTOOL" verify --print-certs "$APK" | head -5
          else
            echo "apksigner not found, skipping verification"
          fi

      - name: Upload release APK (manual)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: samehadaku-dl-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSET="samehadaku-dl-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          sha256sum "$ASSET" > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" SHA256SUMS --clobber
          else
            gh release create "$TAG" "$ASSET" SHA256SUMS \
              --title "Samehadaku DL $TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Prune old release assets and Actions artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: "3"
        run: |
          set -euo pipefail

          # Keep the newest releases; older release pages stay, their files go.
          gh release list --limit 100 --exclude-drafts \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[] | [.tagName, .publishedAt] | @tsv' \
          | awk -v keep="$KEEP_RELEASES" 'NR > keep { print $1 }' \
          | while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "Membersihkan aset rilis lama: $tag"
              if ! assets=$(gh release view "$tag" --json assets --jq '.assets[].name'); then
                echo "  lewati $tag (tidak bisa dibaca)"
                continue
              fi
              printf '%s\n' "$assets" | while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                echo "  hapus $asset"
                gh release delete-asset "$tag" "$asset" --yes \
                  || echo "  gagal menghapus $asset"
              done
            done

          # Actions artifacts are separate from GitHub Releases and count against
          # the Actions storage quota. Tag releases never need them.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[].id' \
          | while IFS= read -r id; do
              [ -n "$id" ] || continue
              echo "Menghapus artifact Actions $id"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" \
                || echo "  gagal menghapus artifact $id"
            done
